# ==============================================================================
# Sabores del Llano — Blueprint de despliegue en Render (Plan Gratuito)
# Base de datos externa: TiDB Cloud Serverless (compatible con MySQL 8 + TLS 1.2+)
# ==============================================================================

services:
  # 1. Backend API (FastAPI + SQLAlchemy 2.0 + PyMySQL)
  - type: web
    name: sabores-del-llano-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL_REQUIRED
        value: "true"
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: FRONTEND_ORIGINS
        value: "https://sabores-del-llano-1.onrender.com"
      - key: ADMIN_INITIAL_USERNAME
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: ADMIN_INITIAL_FULL_NAME
        value: "Doña Luz - Administración"

  # 2. Frontend SPA (React 19 + Vite)
  - type: web
    name: sabores-del-llano-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: "https://sabores-del-llano.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
